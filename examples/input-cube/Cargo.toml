[package]
name = "mulciber-input-cube"
description = "Keyboard, pointer, scroll, focus, pointer capture and fullscreen driving a textured cube"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
glam = { version = "0.34.1", default-features = false, features = ["std"] }
mulciber = { path = "../../crates/mulciber", features = ["vulkan-validation"] }
mulciber-platform = { path = "../../crates/mulciber-platform" }

[build-dependencies]
mulciber-shader = { path = "../../crates/mulciber-shader" }

[lints]
workspace = true
