[package]
name = "mulciber-texture"
version = "0.6.2"
description = "Texture baking for Mulciber games: mip chains, channel packing, BC7 and KTX2, with a source fallback, and SVG sheets rasterised at the size shown"
edition.workspace = true
homepage = "https://github.com/fairhill1/mulciber"
keywords = ["gamedev", "textures", "bc7", "ktx2", "mipmaps"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/fairhill1/mulciber"
rust-version.workspace = true
categories = ["command-line-utilities", "game-development", "graphics"]
publish = ["crates-io"]

[features]
default = ["encode"]
# Intel's ISPC BC7 encoder, the `bake` functions and the `mulciber-texture` CLI. A game's runtime
# only reads bakes and builds fallbacks, and leaves this off.
encode = ["dep:intel_tex_2"]
# SVG sheets of pictures drawn by id at the size shown (resvg), for a game's HUD.
svg = ["dep:resvg"]

[[bin]]
name = "mulciber-texture"
path = "src/main.rs"
required-features = ["encode"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = { version = "0.5.0", optional = true }
ktx2 = "0.5.0"
mulciber = { version = "0.18.1", path = "../mulciber" }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dev-dependencies]
bcdec_rs = "0.2.0"

[lints]
workspace = true
