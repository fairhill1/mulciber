[package]
name = "mulciber-vulkan-triangle"
description = "Native Vulkan presentation probe for Mulciber"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
version.workspace = true

[build-dependencies]
mulciber-shader = { path = "../../crates/mulciber-shader" }
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
mulciber = { path = "../../crates/mulciber" }
mulciber-platform = { path = "../../crates/mulciber-platform" }
